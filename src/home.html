<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>crdt-svg · Tabletop Tables</title>
<link rel="icon" type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='black'/%3E%3Ctext x='3' y='26' font-size='26' fill='%23fffff0' font-family='serif' letter-spacing='-5'%3ETT%3C/text%3E%3C/svg%3E">
<style>
/* ── Variables (matches ui.css palette) ─────────────────── */
:root {
  --bg:            #0d0b13;
  --surface:       rgba(22, 17, 34, 0.88);
  --surface-2:     rgba(36, 29, 52, 0.75);
  --surface-solid: #1a1228;
  --text:          #ddd0b4;
  --text-2:        #8a7d68;
  --text-3:        #4e4438;
  --border:        rgba(210,185,130,0.13);
  --border-2:      rgba(210,185,130,0.26);
  --primary:       #c8941e;
  --primary-soft:  rgba(200,148,30,0.20);
  --radius:        14px;
  --radius-sm:     10px;
  --emboss:
    inset 0 2px 0 rgba(210,185,130,0.40),
    inset 0 -1px 0 rgba(0,0,0,0.55),
    0 0 0 1px rgba(0,0,0,0.70),
    0 4px 18px rgba(0,0,0,0.55);
  --emboss-lg:
    inset 0 2px 0 rgba(210,185,130,0.40),
    inset 0 -1px 0 rgba(0,0,0,0.55),
    0 0 0 1px rgba(0,0,0,0.80),
    0 12px 40px rgba(0,0,0,0.70);
  --font-body:    -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-display: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Layout ──────────────────────────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 100vh;
}

@media (max-width: 768px) {
  .layout {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto;
  }
}

/* ── Left Panel ──────────────────────────────────────────── */
.panel {
  background: var(--surface-solid);
  border-right: 1px solid var(--border-2);
  display: flex;
  flex-direction: column;
  padding: 32px 24px 40px;
  gap: 32px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border-2) transparent;
}

@media (max-width: 768px) {
  .panel {
    position: static;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border-2);
    padding: 28px 20px 32px;
  }
}

/* ── Wordmark ──────────────────────────────────────────────  */
.wordmark {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.wordmark-title {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: normal;
  letter-spacing: 0.04em;
  color: var(--text);
  margin: 0;
  line-height: 1;
}

.wordmark-title span {
  color: var(--primary);
}

.wordmark-sub {
  font-size: 11px;
  color: var(--text-2);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

/* ── Section headings ──────────────────────────────────────  */
.section-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-3);
  margin: 0 0 10px;
  font-family: var(--font-body);
}

/* ── Profile card ──────────────────────────────────────────  */
.profile-card {
  background: var(--surface-2);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--emboss);
}

.profile-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.gradient-swatch {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 2px solid var(--border-2);
  cursor: pointer;
  transition: transform 0.15s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}
.gradient-swatch:hover { transform: scale(1.08); }

.profile-name-input {
  flex: 1;
  background: rgba(0,0,0,0.35);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: var(--font-display);
  font-size: 15px;
  padding: 6px 10px;
  outline: none;
  transition: border-color 0.15s;
}
.profile-name-input:focus {
  border-color: var(--primary);
}
.profile-name-input::placeholder { color: var(--text-3); font-style: italic; }

/* gradient picker row */
.gradient-options {
  display: flex;
  gap: 8px;
  overflow: hidden;
  flex-wrap: nowrap;
}
.grad-option {
  flex: 1 1 0;
  min-width: 0;
  max-width: 26px;
  aspect-ratio: 1;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.12s, border-color 0.12s;
  box-shadow: 0 1px 4px rgba(0,0,0,0.5);
}
.grad-option:hover { transform: scale(1.15); }
.gradient-options .grad-option { display: block; width: 100%; height: 100%; }
.grad-option.active { border-color: var(--primary); }

/* ── Tables list ───────────────────────────────────────────  */
.tables-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 264px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border-2) transparent;
}

.table-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
  text-decoration: none;
  color: inherit;
}
.table-row:hover {
  background: var(--primary-soft);
  border-color: var(--border-2);
}

.table-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.table-name {
  flex: 1;
  font-size: 13px;
  color: var(--text);
  font-family: var(--font-display);
  letter-spacing: 0.02em;
}
.table-date {
  font-size: 10px;
  color: var(--text-3);
}

.tables-empty {
  font-size: 12px;
  color: var(--text-3);
  font-style: italic;
  padding: 6px 2px;
}

/* ── Links footer ──────────────────────────────────────────  */
.panel-footer {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.footer-link {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--text-2);
  text-decoration: none;
  padding: 4px 2px;
  transition: color 0.12s;
}
.footer-link:hover { color: var(--primary); }
.footer-link svg { flex-shrink: 0; opacity: 0.7; }

.footer-tagline {
  font-size: 10px;
  color: var(--text-3);
  line-height: 1.5;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

/* ── Sampler (right) ───────────────────────────────────────  */
.sampler {
  display: flex;
  flex-direction: column;
}

.sampler-row {
  position: relative;
  flex: 1;
  min-height: 200px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

@media (max-width: 768px) {
  .sampler-row { min-height: 180px; }
}

.sampler-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transition: transform 0.4s ease;
}
.sampler-row:hover .sampler-bg { transform: scale(1.03); }

.sampler-tint {
  position: absolute;
  inset: 0;
  transition: background 0.3s;
}
.sampler-row:hover .sampler-tint {
  background: rgba(200, 148, 30, 0.06) !important;
}

/* dice strip */
.sampler-dice {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 0 60px;
  pointer-events: none;
}

.die-wrapper {
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.7));
  opacity: 0.92;
  transform: translateY(0);
  animation: float-die var(--float-dur, 3s) ease-in-out infinite;
  animation-delay: var(--float-delay, 0s);
}

@keyframes float-die {
  0%, 100% { transform: translateY(0px) rotate(var(--rot, 0deg)); }
  50%       { transform: translateY(-6px) rotate(var(--rot, 0deg)); }
}

/* start button */
.start-btn {
  pointer-events: none;
  margin-top: 40px;
  position: relative;
  z-index: 2;
  background: rgba(14, 10, 22, 0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(200,148,30,0.55);
  color: var(--primary);
  font-family: var(--font-display);
  font-size: 15px;
  letter-spacing: 0.08em;
  padding: 11px 28px;
  border-radius: 40px;
  cursor: pointer;
  box-shadow:
    inset 0 1px 0 rgba(210,185,130,0.30),
    0 0 0 1px rgba(0,0,0,0.6),
    0 8px 30px rgba(0,0,0,0.6),
    0 0 20px rgba(200,148,30,0.10);
  transition: background 0.15s, box-shadow 0.15s, transform 0.12s, color 0.15s;
  white-space: nowrap;
}
.start-btn:hover {
  background: rgba(200,148,30,0.18);
  color: #e8b84a;
  box-shadow:
    inset 0 1px 0 rgba(210,185,130,0.40),
    0 0 0 1px rgba(200,148,30,0.45),
    0 0 24px rgba(200,148,30,0.25),
    0 8px 30px rgba(0,0,0,0.6);
  transform: scale(1.04);
}
.start-btn:active { transform: scale(0.97); }

/* separator lines between rows */
.sampler-row + .sampler-row::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: rgba(210,185,130,0.12);
  z-index: 1;
}

/* ── Ripple / transition overlay ───────────────────────────  */
#ripple {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9999;
  overflow: hidden;
}
#ripple-circle {
  position: absolute;
  border-radius: 50%;
  background: var(--bg);
  transform: scale(0);
  transform-origin: center;
  transition: none;
  width: 10px;
  height: 10px;
}

/* ── Scroll fade-ins ───────────────────────────────────────  */
.fade-in {
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.45s ease, transform 0.45s ease;
}
.fade-in.visible {
  opacity: 1;
  transform: none;
}
</style>
</head>

<script>
// ── Gradient generation (FNV-1a, matches entity_gradient.js) ──────────────
function hash32(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h;
}

function entityGradient(name, lumAnchor = 40, satAnchor = 100) {
  const h1 = hash32(name);
  const h2 = hash32(name + '__stop2');
  const h3 = hash32(name + '__lum1');
  const h4 = hash32(name + '__lum2');
  const h5 = hash32(name + '__sat1');
  const h6 = hash32(name + '__sat2');
  const h7 = hash32(name + '__angle');

  const hue1 = h1 % 360;
  const hueDelta = (h2 % 81) - 40;
  const hue2 = ((hue1 + hueDelta) % 360 + 360) % 360;

  const lumMin = Math.max(0, lumAnchor - 20);
  const lumMax = Math.min(100, lumAnchor + 20);
  const lumSteps = [];
  for (let v = lumMin; v <= lumMax; v += 5) lumSteps.push(v);

  const satMin = Math.max(0, satAnchor - 20);
  const satMax = Math.min(100, satAnchor + 20);
  const satSteps = [];
  for (let v = satMin; v <= satMax; v += 5) satSteps.push(v);

  const lum1 = lumSteps[h3 % lumSteps.length];
  const lum2 = lumSteps[h4 % lumSteps.length];
  const sat1 = satSteps[h5 % satSteps.length];
  const sat2 = satSteps[h6 % satSteps.length];
  const angles = [0,45,90,135];
  const angle = angles[h7 % angles.length];

  const c1 = `hsl(${hue1},${sat1}%,${lum1}%)`;
  const c2 = `hsl(${hue2},${sat2}%,${lum2}%)`;
  const grad = `linear-gradient(${angle}deg, ${c1}, ${c2})`;
  return { grad, c1, c2, hue1, hue2, sat1, sat2, lum1, lum2, angle };
}

function drawGradientSwatch(canvas, name) {
  const ctx = canvas.getContext('2d');
  const g = entityGradient(name);
  const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  grad.addColorStop(0, g.c1);
  grad.addColorStop(1, g.c2);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.beginPath();
  ctx.arc(canvas.width/2, canvas.height/2, canvas.width/2, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  return g;
}

// ── Storage ───────────────────────────────────────────────────────────────
const STORAGE_KEY = 'crdt_svg_profile';
const TABLES_KEY  = 'crdt_svg_tables';

function loadProfile() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
}
function saveProfile(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); } catch {}
}
function loadTables() {
  try { return JSON.parse(localStorage.getItem(TABLES_KEY)) || []; } catch { return []; }
}

// ── Profile UI ────────────────────────────────────────────────────────────
const PRESET_NAMES = [
  'Seraphine','Aldric','Morrigan','Kestrel','Voss','Tamsin',
  'Draven','Isolde','Cade','Riven'
];

let profile = loadProfile();
const ADJS = ['Wily','Deadly','Gaunt','Sallow','Brazen','Vexed','Hollow','Sullen','Grim','Feral',
  'Ashen','Dread','Craven','Stout','Wroth','Sunken','Brash','Pallid','Sly','Gnarled',
  'Bleak','Rusted','Sworn','Cursed','Rabid','Silent','Haunted','Gravel','Ireful','Knave'];
const NAMES = ['Frodo','Xorn','Marda','Vex','Quill','Thane','Osric','Yeva','Drask','Noor',
  'Helgen','Zuko','Cavel','Brix','Ilsa','Morwen','Sable','Fenrick','Taza','Gorim',
  'Ulrik','Pell','Dagna','Wren','Jarrek','Chyst','Odra','Byren','Zasha','Rook'];
function randomName() {
  const adj  = ADJS[Math.floor(Math.random() * ADJS.length)];
  const name = NAMES[Math.floor(Math.random() * NAMES.length)];
  return `${adj} ${name}`;
}

if (!profile.name) profile.name = randomName();
if (!profile.gradSeed) profile.gradSeed = profile.name || 'default_' + Date.now();
saveProfile(profile);

const displayNameEl = document.getElementById('displayName');
const swatchEl      = document.getElementById('gradientSwatch');
const gradOptsEl    = document.getElementById('gradientOptions');

displayNameEl.value = profile.name;

function refreshSwatch() {
  const seed = profile.gradSeed || profile.name || 'anonymous';
  drawGradientSwatch(swatchEl, seed);
}
refreshSwatch();

// Preset gradient dots
PRESET_NAMES.forEach(n => {
  const c = document.createElement('canvas');
  c.className = 'grad-option';
  c.width = 26; c.height = 26;
  if (n === profile.gradSeed) c.classList.add('active');
  drawGradientSwatch(c, n);
  c.title = n;
  c.addEventListener('click', () => {
    document.querySelectorAll('.grad-option').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    profile.gradSeed = n;
    saveProfile(profile);
    refreshSwatch();
  });
  gradOptsEl.appendChild(c);
});

swatchEl.addEventListener('click', () => {
  const seed = 'rng_' + Math.random().toString(36).slice(2);
  profile.gradSeed = seed;
  document.querySelectorAll('.grad-option').forEach(x => x.classList.remove('active'));
  saveProfile(profile);
  refreshSwatch();
});

displayNameEl.addEventListener('input', () => {
  profile.name = displayNameEl.value.trim();
  saveProfile(profile);
});

// ── Previous tables ───────────────────────────────────────────────────────
function renderTables() {
  const list = loadTables();
  const el   = document.getElementById('tablesList');
  if (!list.length) {
    el.innerHTML = '<div class="tables-empty">No previous tables yet.<br>Start one from the right →</div>';
    return;
  }
  el.innerHTML = '';
  list.slice().reverse().forEach(t => {
    const a = document.createElement('a');
    a.className = 'table-row';
    a.href = `index.html?bg=${encodeURIComponent(t.bg)}#${encodeURIComponent(t.id)}`;

    const g = entityGradient(t.id);
    const dot = document.createElement('canvas');
    dot.className = 'table-dot';
    dot.width = 10; dot.height = 10;
    const ctx = dot.getContext('2d');
    const grad = ctx.createLinearGradient(0,0,10,10);
    grad.addColorStop(0, g.c1);
    grad.addColorStop(1, g.c2);
    ctx.beginPath();
    ctx.arc(5,5,5,0,Math.PI*2);
    ctx.fillStyle = grad;
    ctx.fill();

    const name = document.createElement('span');
    name.className = 'table-name';
    name.textContent = t.name || t.id;

    const date = document.createElement('span');
    date.className = 'table-date';
    date.textContent = new Date(t.lastVisit).toISOString().slice(0, 10);

    a.append(dot, name, date);
    el.appendChild(a);
  });
}
renderTables();

// ── D6 SVG builder ────────────────────────────────────────────────────────
// ── Template store ────────────────────────────────────────────────────────────
function openTemplateStore() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('crdt-svg-templates', 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore('templates');
    req.onsuccess = e => resolve(e.target.result);
    req.onerror   = e => reject(e.target.error);
  });
}

async function saveTemplate(key, svgText) {
  const db = await openTemplateStore();
  const tx = db.transaction('templates', 'readwrite');
  tx.objectStore('templates').put(svgText, key);
  return new Promise((res, rej) => {
    tx.oncomplete = res;
    tx.onerror    = () => rej(tx.error);
  });
}

// ── Template builder ──────────────────────────────────────────────────────────
function rgbToMatrix([r, g, b]) {
  const rf = (r/255).toFixed(4), gf = (g/255).toFixed(4), bf = (b/255).toFixed(4);
  return `${rf} 0 0 0 0  ${gf} 0 0 0 0  ${bf} 0 0 0 0  0 0 0 1 0`;
}

function makeToyG(d6Source, { toyId, x, y, faceValue, color }) {
  const DISPLAY = 64;
  const prefix  = `${toyId}__`;

  let svg = d6Source
    .replace(/<\?xml[^?]*\?>\s*/i, '')   // strip XML declaration -- illegal when nested
    .replace(/\bid="([^"]+)"/g,          (_, id) => `id="${prefix}${id}"`)
    .replace(/url\(#([^)]+)\)/g,         (_, id) => `url(#${prefix}${id})`)
    .replace(/xlink:href="#([^"]+)"/g,   (_, id) => `xlink:href="#${prefix}${id}"`)
    .replace(/<script[\s\S]*?<\/script>/gi, '')
    .replace(/<script[^>]*\/>/gi,           '')
    .replace(/(<svg\b[^>]*?)>/s, (_, open) => {
      // Synthesize viewBox from source width/height if absent (mirrors svgTextToYXml)
      const srcW = parseFloat((open.match(/\bwidth="([^"]*)"/)  || [])[1]) || 100;
      const srcH = parseFloat((open.match(/\bheight="([^"]*)"/) || [])[1]) || 100;
      const vb   = open.includes('viewBox') ? '' : ` viewBox="0 0 ${srcW} ${srcH}"`;
      const tag  = open
        .replace(/\s+x="[^"]*"/, '').replace(/\s+y="[^"]*"/, '')
        .replace(/\s+width="[^"]*"/, '').replace(/\s+height="[^"]*"/, '');
      return `${tag}${vb} x="${x - DISPLAY/2}" y="${y - DISPLAY/2}" width="${DISPLAY}" height="${DISPLAY}">`;
    })
    .replace(/(<feColorMatrix\b[^>]*?\bvalues=")[^"]*(")/s,
      (_, pre, post) => `${pre}${rgbToMatrix(color)}${post}`)
    .replace(/(<tspan\b[^>]*>)\s*\d+\s*(<\/tspan>)/s, `$1${faceValue}$2`);

  return `<g class="toy" data-toy-id="${toyId}" data-toy-type="dice_d6" ` +
         `data-yid="${toyId}" data-layer-type="toy">${svg}</g>`;
}

function buildTemplateSVG(d6Source, { bg, bgWidth, bgHeight, values, colors }) {
  const spread  = Math.min(bgWidth, bgHeight) * 0.22;
  const cx      = bgWidth  / 2;
  const cy      = bgHeight / 2;
  const offsets = [
    { dx: -spread * 1.5, dy: -spread * 0.3 },
    { dx: -spread * 0.5, dy:  spread * 0.4 },
    { dx:  spread * 0.5, dy: -spread * 0.4 },
    { dx:  spread * 1.5, dy:  spread * 0.3 },
  ];
  const toyGs = values.map((faceValue, i) => {
    const toyId = `tmpl_${bg}_d${i}_${Math.random().toString(36).slice(2, 7)}`;
    return makeToyG(d6Source, {
      toyId, faceValue, color: colors[i],
      x: Math.round(cx + offsets[i].dx),
      y: Math.round(cy + offsets[i].dy),
    });
  }).join('\n    ');
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">` +
         `<g id="toys-layer">\n    ${toyGs}\n  </g></svg>`;
}

// ── Fetch d6 + write templates to IndexedDB ───────────────────────────────────
const TEMPLATE_VERSION = 3; // bump to force-refresh on changes
const TEMPLATE_VER_KEY = 'crdt_svg_tmpl_ver';

async function ensureTemplates() {
  const stored = parseInt(localStorage.getItem(TEMPLATE_VER_KEY) || '0', 10);
  if (stored >= TEMPLATE_VERSION) return;
  let d6Source;
  try {
    const res = await fetch('toy/dice_d6.svg');
    if (!res.ok) throw new Error(res.status);
    d6Source = await res.text();
  } catch (e) {
    console.warn('crdt-svg home: could not fetch dice_d6.svg', e);
    return;
  }
  await Promise.all(ROWS.map(row =>
    saveTemplate(`starter-${row.bg}`, buildTemplateSVG(d6Source, row))
  ));
  localStorage.setItem(TEMPLATE_VER_KEY, String(TEMPLATE_VERSION));
}

ensureTemplates(); // fire-and-forget; ready well before any click

// On back-navigation (bfcache restore): reset ripple and refresh tables list.

  const circle = document.getElementById('ripple-circle');
  circle.style.transition = 'none';
  circle.style.transform  = 'scale(0)';
  renderTables();

// ── Sampler preview dice (decorative only, not stored) ────────────────────────
function makeDie(value, [r, g, b]) {
  const rf = (r/255).toFixed(3), gf = (g/255).toFixed(3), bf = (b/255).toFixed(3);
  const matrix = `${rf} 0 0 0 0  ${gf} 0 0 0 0  ${bf} 0 0 0 0  0 0 0 1 0`;
  const uid = `${value}-${r}-${g}-${b}`;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="64" height="80" viewBox="0 0 80 100">
  <defs>
    <filter id="col-${uid}"><feColorMatrix type="matrix" values="${matrix}"/></filter>
    <linearGradient id="lg-${uid}" x1="0" y1="22.6" x2="0" y2="88.9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <g filter="url(#col-${uid})">
    <path style="fill:#000;fill-opacity:0.5" d="m16.3,45.6 c-1.7,0-5.2,0.07-6.2,0.64 -1.6,0.9-1.73,1.6-1.9,5.0 l-2.88,32.3 c0.03,1.4 6.4,6.3 8.3,6.3 h52 c1.9,0 8.3,-4.9 8.3,-6.3 l-2.88,-32.3 c-0.18,-3.4-0.31,-4.1-1.9,-5.0 -1.05,-0.57-4.55,-0.64-6.23,-0.64 z"/>
    <path d="m16.3,11.5 c-1.7,0-5.2,0.12-6.2,1.1 -1.6,1.56-1.73,2.79-1.9,8.66 l-2.88,55.7 c0.03,2.39 6.4,10.83 8.3,10.83 h52 c1.9,0 8.3,-8.44 8.3,-10.83 l-2.88,-55.7 c-0.18,-5.87-0.31,-7.1-1.9,-8.66 -1.05,-0.98-4.55,-1.1-6.23,-1.1 z" style="fill:#9b9b9b;stroke:#000;stroke-width:1.31;stroke-linejoin:round"/>
    <path d="m12,11.7 h55 c1.66,0 2.94,1.34 3,3 l2,59 c0.06,1.66-1.34,3-3,3 h-59 c-1.66,0-3.06,-1.34-3,-3 l2,-59 c0.056,-1.66 1.34,-3 3,-3 z" style="fill:#dedede;stroke:url(#lg-${uid});stroke-width:1.31;stroke-linejoin:round"/>
  </g>
  <text x="${value >= 10 ? 12 : 24}" y="62" style="font-size:50px;font-family:sans-serif;fill:#000">${value}</text>
</svg>`;
}

const rotations = [-8, 4, -3, 9];
const floatDurs = [3.2, 3.8, 2.9, 3.5];
const delays    = [0, 0.7, 0.4, 1.1];

const sampler = document.getElementById('sampler');

ROWS.forEach((row, ri) => {
  const div = document.createElement('div');
  div.className = 'sampler-row fade-in';
  div.style.transitionDelay = `${0.05 + ri * 0.07}s`;

  const bgDiv = document.createElement('div');
  bgDiv.className = 'sampler-bg';
  bgDiv.style.backgroundImage = `url('img/bg_${row.bg}.png')`;

  const tintDiv = document.createElement('div');
  tintDiv.className = 'sampler-tint';
  tintDiv.style.background = row.tint;

  const diceDiv = document.createElement('div');
  diceDiv.className = 'sampler-dice';

  row.values.forEach((val, di) => {
    const wrapper = document.createElement('div');
    wrapper.className = 'die-wrapper';
    wrapper.style.setProperty('--rot', `${rotations[di]}deg`);
    wrapper.style.setProperty('--float-dur', `${floatDurs[di]}s`);
    wrapper.style.setProperty('--float-delay', `${delays[di]}s`);
    wrapper.innerHTML = makeDie(val, row.colors[di]);
    diceDiv.appendChild(wrapper);
  });

  const btn = document.createElement('button');
  btn.className = 'start-btn';
  btn.textContent = 'Start Here';

  div.append(bgDiv, tintDiv, diceDiv, btn);
  sampler.appendChild(div);

  div.addEventListener('click', e => launchRipple(e.clientX, e.clientY, row));
});

// ── Ripple transition ─────────────────────────────────────────────────────────
function launchRipple(cx, cy, row) {
  const circle = document.getElementById('ripple-circle');
  const maxDist = Math.hypot(
    Math.max(cx, window.innerWidth  - cx),
    Math.max(cy, window.innerHeight - cy)
  );
  const diameter = maxDist * 2.2;
  circle.style.transition = 'none';
  circle.style.width      = diameter + 'px';
  circle.style.height     = diameter + 'px';
  circle.style.left       = (cx - diameter/2) + 'px';
  circle.style.top        = (cy - diameter/2) + 'px';
  circle.style.transform  = 'scale(0)';
  circle.getBoundingClientRect();
  circle.style.transition = 'transform 0.55s cubic-bezier(0.4,0,0.2,1)';
  circle.style.transform  = 'scale(1)';

  const roomId = generateRoomId();
  recordTableVisit(roomId, row);

  setTimeout(() => {
    const params = new URLSearchParams({ bg: row.bg, template: `starter-${row.bg}` });
    window.location.href = `index.html?${params}#${roomId}`;
  }, 520);
}

function generateRoomId() {
  const dd    = String(new Date().getDate()).padStart(2, '0');
  const chars = 'abcdefghijklmnopqrstuvwxyz';
  const rand  = Array.from({length: 3}, () => chars[Math.floor(Math.random()*chars.length)]).join('');
  const name  = (loadProfile().name || '').trim();
  const slug  = name
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')   // special chars → hyphen
    .replace(/^-+|-+$/g, '')        // trim leading/trailing hyphens
    .slice(0, 10)
    || 'table';
  return `${slug}-${dd}${rand}`;
}

function recordTableVisit(roomId, row) {
  const tables = loadTables();
  tables.push({ id: roomId, bg: row.bg, name: roomId, lastVisit: Date.now() });
  if (tables.length > 20) tables.splice(0, tables.length - 20);
  try { localStorage.setItem(TABLES_KEY, JSON.stringify(tables)); } catch {}
}

// ── Intersection observer for fade-ins ────────────────────────────────────────
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); }
  });
}, { threshold: 0.05 });

document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
</script>
